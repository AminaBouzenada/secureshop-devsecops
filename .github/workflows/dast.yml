name: DAST - Dynamic Application Security Testing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for all services to be ready..."
          sleep 90

      - name: Wait for API gateway to be healthy
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Gateway is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 10s..."
            sleep 10
          done
        continue-on-error: true

      # Get the Docker network name
      - name: Get Docker network
        id: network
        run: |
          NETWORK=$(docker network ls --filter "name=$(basename $(pwd))" --format "{{.Name}}" | head -n 1)
          echo "network=$NETWORK" >> $GITHUB_OUTPUT
          echo "Using network: $NETWORK"

      # Create reports directory with proper permissions
      - name: Create ZAP reports directory
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          chmod 777 ${{ github.workspace }}/zap-reports

      # ZAP scans with user mapping to fix permissions
      - name: ZAP - API Gateway
        run: |
          docker run --rm \
            --network ${{ steps.network.outputs.network }} \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk/:rw \
            --user $(id -u):$(id -g) \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://gateway:80 \
            -r gateway-report.html \
            -J gateway-report.json \
            -w gateway-report.md \
            -a || true

      - name: Display Gateway Scan Results
        if: always()
        run: |
          echo "=== API GATEWAY SCAN RESULTS ==="
          if [ -f "${{ github.workspace }}/zap-reports/gateway-report.md" ]; then
            cat "${{ github.workspace }}/zap-reports/gateway-report.md"
          else
            echo "⚠️ Gateway report not found"
          fi
          echo ""

      - name: ZAP - User Service
        run: |
          docker run --rm \
            --network ${{ steps.network.outputs.network }} \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk/:rw \
            --user $(id -u):$(id -g) \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://user-service:8001 \
            -r user-report.html \
            -J user-report.json \
            -w user-report.md || true

      - name: Display User Service Scan Results
        if: always()
        run: |
          echo "=== USER SERVICE SCAN RESULTS ==="
          if [ -f "${{ github.workspace }}/zap-reports/user-report.md" ]; then
            cat "${{ github.workspace }}/zap-reports/user-report.md"
          else
            echo "⚠️ User service report not found"
          fi
          echo ""

      - name: ZAP - Product Service
        run: |
          docker run --rm \
            --network ${{ steps.network.outputs.network }} \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk/:rw \
            --user $(id -u):$(id -g) \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://product-service:8002 \
            -r product-report.html \
            -J product-report.json \
            -w product-report.md || true

      - name: Display Product Service Scan Results
        if: always()
        run: |
          echo "=== PRODUCT SERVICE SCAN RESULTS ==="
          if [ -f "${{ github.workspace }}/zap-reports/product-report.md" ]; then
            cat "${{ github.workspace }}/zap-reports/product-report.md"
          else
            echo "⚠️ Product service report not found"
          fi
          echo ""

      # Summary of all findings
      - name: Generate Security Summary
        if: always()
        run: |
          echo "# 🔒 DAST Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for service in gateway user product; do
            echo "## ${service^} Service" >> $GITHUB_STEP_SUMMARY
            
            if [ -f "${{ github.workspace }}/zap-reports/${service}-report.json" ]; then
              # Parse JSON to count alerts by risk level
              HIGH=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' "${{ github.workspace }}/zap-reports/${service}-report.json" 2>/dev/null || echo "0")
              MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode=="2")] | length' "${{ github.workspace }}/zap-reports/${service}-report.json" 2>/dev/null || echo "0")
              LOW=$(jq '[.site[].alerts[] | select(.riskcode=="1")] | length' "${{ github.workspace }}/zap-reports/${service}-report.json" 2>/dev/null || echo "0")
              INFO=$(jq '[.site[].alerts[] | select(.riskcode=="0")] | length' "${{ github.workspace }}/zap-reports/${service}-report.json" 2>/dev/null || echo "0")
              
              echo "- 🔴 High: **$HIGH**" >> $GITHUB_STEP_SUMMARY
              echo "- 🟡 Medium: **$MEDIUM**" >> $GITHUB_STEP_SUMMARY
              echo "- 🔵 Low: **$LOW**" >> $GITHUB_STEP_SUMMARY
              echo "- ℹ️ Informational: **$INFO**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No report generated" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      # Verify reports were created
      - name: List generated reports
        if: always()
        run: |
          echo "Contents of zap-reports directory:"
          ls -lah ${{ github.workspace }}/zap-reports/ || echo "Directory not found or empty"

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: ${{ github.workspace }}/zap-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down -v