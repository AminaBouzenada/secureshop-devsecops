name: OWASP ZAP DAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Start the application stack
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 30

      # 3. Health check - make sure the target is up
      - name: Wait for API Gateway
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:80/health > /dev/null 2>&1; then
              echo "API Gateway is up!"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 5
          done

      # 4. Run OWASP ZAP Baseline Scan
      #    FIXES APPLIED:
      #    - Removed invalid inputs: report_html, report_json
      #    - ZAP action v0.12.0+ auto-generates reports internally
      #    - Use allow_issue_writing: false to prevent noisy PR comments
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:80'
          rules_file_name: '.zap/rules.tsv'       # optional: suppress known FPs
          cmd_options: '-a'                         # include ajax spider
          allow_issue_writing: false                # set true if you want GitHub issues

      # 5. Upload ZAP reports as artifacts
      #    FIX: artifact name uses hyphens, NOT underscores (zap-scan not zap_scan)
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-html          # FIXED: was zap_scan (underscores invalid)
          path: report_html.html
          retention-days: 30

      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-json          # FIXED: was zap_scan (underscores invalid)
          path: report_json.json
          retention-days: 30

      # 6. Upload SARIF to GitHub Security tab
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: report_sarif.sarif

      # 7. Tear down Docker Compose
      - name: Stop services
        if: always()
        run: docker compose down