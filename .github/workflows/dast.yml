name: DAST - Dynamic Application Security Testing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for all services to be ready..."
          sleep 90

      - name: Wait for API gateway to be healthy
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Gateway is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 10s..."
            sleep 10
          done
        continue-on-error: true

      # -----------------------------
      # Create directory for ZAP reports
      # -----------------------------
      - name: Create ZAP reports directory
        run: mkdir -p zap-reports

      # -----------------------------
      # ZAP SCANS with corrected volume mounts
      # Reports are saved to ./zap-reports/ on the host
      # -----------------------------

      - name: ZAP - API Gateway
        run: |
          docker run --network host \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost \
            -r gateway-report.html \
            -J gateway-report.json \
            -a || true

      - name: ZAP - User Service
        run: |
          docker run --network host \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8001 \
            -r user-report.html \
            -J user-report.json || true

      - name: ZAP - Product Service
        run: |
          docker run --network host \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8002 \
            -r product-report.html \
            -J product-report.json || true

      # -----------------------------
      # Verify reports were created
      # -----------------------------
      - name: List generated reports
        if: always()
        run: |
          echo "Contents of zap-reports directory:"
          ls -lah zap-reports/

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-reports/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down -v