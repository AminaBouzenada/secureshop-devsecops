name: DAST - Dynamic Application Security Testing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for all services to be ready..."
          sleep 90

      - name: Wait for API gateway to be healthy
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Gateway is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 10s..."
            sleep 10
          done
        continue-on-error: true

      - name: ZAP Baseline Scan - API Gateway
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost'
          allow_issue_writing: false
          cmd_options: '-a'
        continue-on-error: true

      - name: ZAP Baseline Scan - User Service
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8001'
          allow_issue_writing: false
        continue-on-error: true

      - name: ZAP Baseline Scan - Product Service
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8002'
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: docker compose down -v