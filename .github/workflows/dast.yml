name: DAST - Dynamic Application Security Testing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for all services to be ready..."
          sleep 90

      - name: Wait for API gateway to be healthy
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Gateway is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 10s..."
            sleep 10
          done
        continue-on-error: true

      # -----------------------------
      # ZAP SCANS with manual Docker execution
      # This bypasses the artifact upload issues in the action
      # -----------------------------

      - name: ZAP - API Gateway
        run: |
          docker run --network host \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost \
            -r zap-gateway-report.html \
            -J zap-gateway-report.json \
            -a || true

      - name: ZAP - User Service
        run: |
          docker run --network host \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8001 \
            -r zap-user-report.html \
            -J zap-user-report.json || true

      - name: ZAP - Product Service
        run: |
          docker run --network host \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8002 \
            -r zap-product-report.html \
            -J zap-product-report.json || true

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-*-report.html
            zap-*-report.json
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down -v