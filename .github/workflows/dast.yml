name: DAST - Dynamic Application Security Testing

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for all services to be ready..."
          sleep 90

      - name: Wait for API gateway to be healthy
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/health; then
              echo "Gateway is up!"
              break
            fi
            echo "Attempt $i/15 — retrying in 10s..."
            sleep 10
          done
        continue-on-error: true

      # -----------------------------
      # ZAP SCANS (FIXED)
      # report_html / report_json removed — not valid inputs for action-baseline.
      # ZAP generates and uploads its own reports; use artifact_name to label them.
      # artifact_name must use hyphens only (underscores cause upload to fail).
      # -----------------------------

      - name: ZAP - API Gateway
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'
          artifact_name: zap-report-gateway
          allow_issue_writing: false
          cmd_options: '-a'
        continue-on-error: true

      - name: ZAP - User Service
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8001'
          artifact_name: zap-report-user
          allow_issue_writing: false
        continue-on-error: true

      - name: ZAP - Product Service
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8002'
          artifact_name: zap-report-product
          allow_issue_writing: false
        continue-on-error: true

      # -----------------------------
      # Manual upload-artifact step removed.
      # Each ZAP action above already uploads HTML + JSON + SARIF reports
      # under its own artifact_name. Nothing lands on the runner filesystem
      # for a manual step to pick up, which is why the old step produced
      # 0-byte files.
      # -----------------------------

      - name: Stop services
        if: always()
        run: docker compose down -v