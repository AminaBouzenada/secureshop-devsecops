name: SAST Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bandit-python:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: |
          pip install bandit[sarif]
      
      - name: Run Bandit on User Service
        run: |
          bandit -r services/user-service/app -f sarif -o bandit-user-service.sarif || true
      
      - name: Run Bandit on Order Service
        run: |
          bandit -r services/order-service/app -f sarif -o bandit-order-service.sarif || true
      
      - name: Upload User Service SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-user-service.sarif
          category: bandit-user-service
      
      - name: Upload Order Service SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-order-service.sarif
          category: bandit-order-service

  semgrep:
    name: Semgrep Multi-Language SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Semgrep
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif || true
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  spotbugs-java:
    name: SpotBugs Java SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build Product Service
        run: |
          cd services/product-service
          mvn clean compile spotbugs:spotbugs || true
      
      - name: Upload SpotBugs Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: spotbugs-results
          path: services/product-service/target/spotbugsXml.xml
