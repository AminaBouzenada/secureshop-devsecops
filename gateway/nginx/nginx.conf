events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8001;
    }
    
    upstream product_service {
        server product-service:8002;
    }
    
    upstream order_service {
        server order-service:8003;
    }
    
    upstream payment_service {
        server payment-service:8004;
    }
    
    upstream notification_service {
        server notification-service:8005;
    }
    
    upstream inventory_service {
        server inventory-service:8006;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    
    server {
        listen 80;
        server_name localhost;
        
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # User Service
        location /api/v1/users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/v1/register {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }
        
        location /api/v1/login {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }
        
        location /api/v1/profile {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        
        # Product Service
        location /api/v1/products {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
        }
        
        # Order Service
        location /api/v1/orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        
        # Payment Service
        location /api/v1/payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
        }
        
        # Notification Service
        location /api/v1/notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
        }
        
        # Inventory Service
        location /api/v1/inventory {
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
        }
        
        # Health check endpoint
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
